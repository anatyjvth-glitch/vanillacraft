<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Craft - Главная</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1b1b1b, #2d2d2d);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 12px;
            border: 3px solid #444;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            color: #aaa;
            margin-bottom: 25px;
        }
        .play-btn {
            display: inline-block;
            padding: 15px 40px;
            background: #4caf50;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            border: 2px solid #2e7d32;
        }
        .play-btn:hover {
            background: #43a047;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vanilla Craft</h1>
        <p>3D-песочница прямо в браузере. Строй и исследуй!</p>
        <a href="game.html" class="play-btn">Играть</a>
    </div>
</body>
</html>
